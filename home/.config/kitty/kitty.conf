font_family      Comic Code
bold_font        auto
italic_font      auto
bold_italic_font auto

# terminal bell
enable_audio_bell no
macos_show_window_title_in window
scrollback_lines 10000
strip_trailing_spaces smart
window_padding_width 6
macos_option_as_alt left

# confirm_os_window_close -1 count-background
macos_quit_when_last_window_closed yes

# Explicitly route emoji and symbol ranges to Apple Color Emoji,
# since Comic Code does not include these glyphs.
# symbol_map U+1F300-U+1F5FF Apple Color Emoji
# symbol_map U+1F600-U+1F64F Apple Color Emoji
# symbol_map U+1F680-U+1F6FF Apple Color Emoji
# symbol_map U+1F700-U+1F77F Apple Color Emoji
# symbol_map U+1F780-U+1F7FF Apple Color Emoji
# symbol_map U+1F800-U+1F8FF Apple Color Emoji
# symbol_map U+1F900-U+1F9FF Apple Color Emoji
# symbol_map U+1FA00-U+1FA6F Apple Color Emoji
# symbol_map U+1FA70-U+1FAFF Apple Color Emoji
# symbol_map U+1F1E0-U+1F1FF Apple Color Emoji
# symbol_map U+2600-U+26FF   Apple Color Emoji
# symbol_map U+2700-U+27BF   Apple Color Emoji
# symbol_map U+FE00-U+FE0F   Apple Color Emoji
# symbol_map U+1F004-U+1F004 Apple Color Emoji
# symbol_map U+1F0CF-U+1F0CF Apple Color Emoji
