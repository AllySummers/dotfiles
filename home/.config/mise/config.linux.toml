# ── Bootstrap: system packages (Linux) ───────────────────────────────────────
# brew/brew-cask packages live in config.macos.toml (loaded on macOS only).
[bootstrap.packages]
"apt:git" = "latest"
"apt:curl" = "latest"
"apt:zsh" = "latest"
"apt:build-essential" = "latest"
"apt:ca-certificates" = "latest"
"pacman:git" = "latest"
"pacman:curl" = "latest"
"pacman:zsh" = "latest"
# "pacman:git-town" = "latest"
"pacman:base-devel" = "latest"
"pacman:ca-certificates" = "latest"
"dnf:git" = "latest"
"dnf:curl" = "latest"
"dnf:zsh" = "latest"
"dnf:make" = "latest"
"dnf:gcc" = "latest"
"dnf:ca-certificates" = "latest"

# Editor settings: shared keys plus two editor-specific keys; keep other app settings.
[dotfiles]
"~/.config/Cursor/User/settings.json/shared" = { source = "~/.dotfiles/templates/editors/settings.jsonc", merge = true, format = "jsonc", template = "tera" }
"~/.config/Cursor/User/settings.json/editor" = { source = "~/.dotfiles/templates/editors/cursor.json", merge = true, format = "jsonc" }
"~/.config/Code/User/settings.json/shared" = { source = "~/.dotfiles/templates/editors/settings.jsonc", merge = true, format = "jsonc", template = "tera" }
"~/.config/Code/User/settings.json/editor" = { source = "~/.dotfiles/templates/editors/vscode.json", merge = true, format = "jsonc" }
"~/.config/Code - Insiders/User/settings.json/shared" = { source = "~/.dotfiles/templates/editors/settings.jsonc", merge = true, format = "jsonc", template = "tera" }
"~/.config/Code - Insiders/User/settings.json/editor" = { source = "~/.dotfiles/templates/editors/vscode.json", merge = true, format = "jsonc" }
