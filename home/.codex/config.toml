model_reasoning_effort = "high"
personality = "pragmatic"
sandbox_mode = "read-only"
service_tier = "priority"
web_search = "live"

[desktop]
conversationDetailMode = "STEPS_COMMANDS"
default-service-tier = "fast"
dock-icon-preference = "app-default"
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "ultra", "max"]
followUpQueueMode = "queue"
git-pull-request-merge-method = "squash"
open-link-in-target-preference = "external-browser"
avatar-overlay-pet-visible = false

[desktop.open-in-target-preferences]
global = "cursor"

[features]
js_repl = true
memories = true

[memories]
generate_memories = true
use_memories = true

# Disclosure events leave the Atuin tool hooks in hooks.json untouched.
# agent:disclosure replies only to shell output carrying the agent:disclosure-info
# marker. Merges never delete keys, so empty arrays clear events earlier versions used.
[hooks]
SessionStart = []
UserPromptSubmit = []
PreToolUse = []
SubagentStart = []

[[hooks.PostToolUse]]
matcher = "Bash"

[[hooks.PostToolUse.hooks]]
type = "command"
command = '''{% if os() == 'windows' %}& "{{ env.HOME | replace(from='\\', to='/') }}/AppData/Local/mise/mise.exe"{% else %}"{{ env.HOME }}/.local/bin/mise"{% endif %} --cd "{{ env.HOME | replace(from='\\', to='/') }}" run --quiet --raw agent:disclosure codex'''
timeout = 5

[mcp_servers.atuin]
command = '''{% if os() == 'windows' %}{{ env.HOME | replace(from='\\', to='/') }}/AppData/Local/mise/mise.exe{% else %}{{ env.HOME }}/.local/bin/mise{% endif %}'''
args = ['--cd', '''{{ env.HOME | replace(from='\\', to='/') }}''', 'run', '--quiet', '--raw', 'agent:atuin-mcp']
