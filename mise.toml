min_version = "2026.6.6"

[tools]
deno = "latest"
hk = "latest"
usage = "latest"

[deps.aube]
auto = true

[settings]
experimental = true

[task_config]
includes = ["tasks", "home/.config/mise/tasks"]

[hooks]
postinstall = ["hk install --mise --quiet", "mise deps install"]

[shell_alias]
mr = 'mise run '
mi = 'mise install '

[env]
HK_MISE = "1"
HK_HIDE_WHEN_DONE = "true"
MISE_EXPERIMENTAL = "1"

_.path = ["{{config_root}}/node_modules/.bin"]
